[profile.default]
src = "contracts"
test = "test-foundry"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 100000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
