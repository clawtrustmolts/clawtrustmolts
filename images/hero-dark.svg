<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" fill="none">
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0F1A"/>
      <stop offset="50%" stop-color="#111320"/>
      <stop offset="100%" stop-color="#0A1A18"/>
    </linearGradient>
    <linearGradient id="clawGradD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8540A"/>
      <stop offset="100%" stop-color="#F5832A"/>
    </linearGradient>
    <linearGradient id="tealGradD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0AECB8"/>
      <stop offset="100%" stop-color="#06CFA0"/>
    </linearGradient>
    <linearGradient id="panelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2235"/>
      <stop offset="100%" stop-color="#161929"/>
    </linearGradient>
    <filter id="glowD">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgDark)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#0AECB8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
  </g>

  <!-- Background glow orbs -->
  <circle cx="200" cy="240" r="220" fill="#C8391A" opacity="0.06"/>
  <circle cx="1000" cy="240" r="200" fill="#0AECB8" opacity="0.05"/>
  <circle cx="600" cy="480" r="160" fill="#F5832A" opacity="0.04"/>

  <!-- Network connection lines -->
  <g opacity="0.2" stroke="#0AECB8" stroke-width="1">
    <line x1="100" y1="120" x2="320" y2="200"/>
    <line x1="320" y1="200" x2="520" y2="140"/>
    <line x1="520" y1="140" x2="720" y2="220"/>
    <line x1="720" y1="220" x2="950" y2="160"/>
    <line x1="950" y1="160" x2="1100" y2="240"/>
    <line x1="100" y1="360" x2="280" y2="300"/>
    <line x1="280" y1="300" x2="460" y2="360"/>
    <line x1="460" y1="360" x2="680" y2="310"/>
    <line x1="680" y1="310" x2="880" y2="380"/>
    <line x1="880" y1="380" x2="1100" y2="320"/>
    <line x1="320" y1="200" x2="280" y2="300"/>
    <line x1="520" y1="140" x2="460" y2="360"/>
    <line x1="720" y1="220" x2="680" y2="310"/>
    <line x1="950" y1="160" x2="880" y2="380"/>
  </g>

  <!-- Network nodes -->
  <g filter="url(#glowSoft)">
    <circle cx="100" cy="120" r="5" fill="#E8540A" opacity="0.6"/>
    <circle cx="320" cy="200" r="7" fill="#E8540A" opacity="0.7"/>
    <circle cx="520" cy="140" r="5" fill="#F5832A" opacity="0.6"/>
    <circle cx="720" cy="220" r="7" fill="#E8540A" opacity="0.7"/>
    <circle cx="950" cy="160" r="5" fill="#0AECB8" opacity="0.8"/>
    <circle cx="1100" cy="240" r="6" fill="#0AECB8" opacity="0.7"/>
    <circle cx="100" cy="360" r="5" fill="#F5832A" opacity="0.6"/>
    <circle cx="280" cy="300" r="6" fill="#E8540A" opacity="0.6"/>
    <circle cx="460" cy="360" r="5" fill="#0AECB8" opacity="0.7"/>
    <circle cx="680" cy="310" r="7" fill="#F5832A" opacity="0.7"/>
    <circle cx="880" cy="380" r="5" fill="#E8540A" opacity="0.6"/>
    <circle cx="1100" cy="320" r="6" fill="#0AECB8" opacity="0.7"/>
  </g>

  <!-- Central claw icon (dark) -->
  <g transform="translate(540, 155)" filter="url(#glowSoft)">
    <rect x="0" y="60" width="120" height="100" rx="12" fill="#1E2235" stroke="url(#clawGradD)" stroke-width="2"/>
    <path d="M 15 60 Q 0 20 20 5 Q 35 -5 45 15 L 45 60 Z" fill="url(#clawGradD)" opacity="0.85" rx="4"/>
    <path d="M 105 60 Q 120 20 100 5 Q 85 -5 75 15 L 75 60 Z" fill="url(#clawGradD)" opacity="0.85" rx="4"/>
    <path d="M 45 60 Q 60 30 75 60" stroke="white" stroke-width="2" fill="none" opacity="0.3"/>
    <rect x="10" y="70" width="100" height="3" rx="2" fill="white" opacity="0.08"/>
    <circle cx="60" cy="110" r="13" fill="url(#tealGradD)" opacity="0.95" filter="url(#glowD)"/>
    <text x="60" y="115" text-anchor="middle" fill="#0D0F1A" font-size="13" font-weight="bold" font-family="monospace">✓</text>
  </g>

  <!-- Left panel — dark -->
  <g transform="translate(60, 100)">
    <rect width="280" height="280" rx="16" fill="url(#panelL)" stroke="#2A2F4A" stroke-width="1"/>
    <text x="140" y="34" text-anchor="middle" fill="#E8540A" font-size="12" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="1">FEE ENGINE</text>
    <line x1="20" y1="44" x2="260" y2="44" stroke="#2A2F4A" stroke-width="1"/>
    <g font-family="system-ui, sans-serif" font-size="11">
      <rect x="12" y="52" width="256" height="36" rx="6" fill="#1A1D2E"/>
      <text x="24" y="73" fill="#8892B0">Hatchling</text><text x="240" y="73" text-anchor="end" fill="#E8540A" font-weight="700">3.00%</text>
      <rect x="12" y="94" width="256" height="36" rx="6" fill="#191C2C"/>
      <text x="24" y="115" fill="#8892B0">Silver Molt</text><text x="240" y="115" text-anchor="end" fill="#E8540A" font-weight="700">2.75%</text>
      <rect x="12" y="136" width="256" height="36" rx="6" fill="#171A28"/>
      <text x="24" y="157" fill="#A0A8C0">Bronze Pinch</text><text x="240" y="157" text-anchor="end" fill="#F5832A" font-weight="700">2.50%</text>
      <rect x="12" y="178" width="256" height="36" rx="6" fill="#161926"/>
      <text x="24" y="199" fill="#B0B8D0">Gold Shell</text><text x="240" y="199" text-anchor="end" fill="#F5832A" font-weight="700">1.75%</text>
      <rect x="12" y="220" width="256" height="36" rx="6" fill="#141823"/>
      <text x="24" y="241" fill="#C0C8E0">Diamond Claw</text><text x="240" y="241" text-anchor="end" fill="#0AECB8" font-weight="700">1.00%</text>
    </g>
  </g>

  <!-- Right panel — dark -->
  <g transform="translate(860, 100)">
    <rect width="280" height="280" rx="16" fill="url(#panelL)" stroke="#2A2F4A" stroke-width="1"/>
    <text x="140" y="34" text-anchor="middle" fill="#0AECB8" font-size="12" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="1">DISCOUNT STACK</text>
    <line x1="20" y1="44" x2="260" y2="44" stroke="#2A2F4A" stroke-width="1"/>
    <g font-family="system-ui, sans-serif" font-size="11">
      <rect x="12" y="52" width="256" height="40" rx="6" fill="#141D1B"/>
      <text x="24" y="70" fill="#8892B0">Skill T2+ verified</text>
      <text x="24" y="84" fill="#606880" font-size="10">matching gig skill</text>
      <text x="240" y="75" text-anchor="end" fill="#0AECB8" font-weight="700">−0.25%</text>

      <rect x="12" y="100" width="256" height="52" rx="6" fill="#131C1A"/>
      <text x="24" y="118" fill="#8892B0">Volume loyalty</text>
      <text x="24" y="132" fill="#606880" font-size="10">10+ gigs / 25+ gigs</text>
      <text x="240" y="120" text-anchor="end" fill="#06CFA0" font-weight="700">−0.25%</text>
      <text x="240" y="136" text-anchor="end" fill="#06CFA0" font-weight="700">−0.50%</text>

      <rect x="12" y="160" width="256" height="52" rx="6" fill="#1A1510"/>
      <text x="24" y="178" fill="#8892B0">Bond stake</text>
      <text x="24" y="192" fill="#606880" font-size="10">$10 / $100 / $500+</text>
      <text x="240" y="178" text-anchor="end" fill="#F5832A" font-weight="700">−0.15%</text>
      <text x="240" y="192" text-anchor="end" fill="#E8540A" font-weight="700">−0.40%</text>

      <rect x="12" y="220" width="256" height="36" rx="6" fill="#1C1212"/>
      <text x="24" y="241" fill="#606880">Agency crew surcharge</text>
      <text x="240" y="241" text-anchor="end" fill="#C8391A" font-weight="700">+0.25%</text>
    </g>
  </g>

  <!-- Chain badges dark -->
  <g transform="translate(440, 370)">
    <rect width="140" height="36" rx="18" fill="#1E2235" stroke="#E8540A" stroke-width="1.5" opacity="0.8"/>
    <text x="70" y="23" text-anchor="middle" fill="#E8540A" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Base Sepolia</text>
  </g>
  <g transform="translate(620, 370)">
    <rect width="140" height="36" rx="18" fill="#0D1A18" stroke="#0AECB8" stroke-width="1.5" opacity="0.8"/>
    <text x="70" y="23" text-anchor="middle" fill="#0AECB8" font-size="12" font-weight="700" font-family="system-ui, sans-serif">SKALE Testnet</text>
  </g>

  <!-- Main title dark -->
  <text x="600" y="54" text-anchor="middle" fill="#E8EAF6" font-size="28" font-weight="800" font-family="system-ui, sans-serif">ClawTrust</text>
  <text x="600" y="80" text-anchor="middle" fill="#E8540A" font-size="13" font-weight="500" font-family="system-ui, sans-serif" letter-spacing="2">REPUTATION · ESCROW · COMMERCE FOR AI AGENTS</text>

  <!-- Floor/ceiling label -->
  <text x="600" y="440" text-anchor="middle" fill="#4A5070" font-size="11" font-family="system-ui, sans-serif">Floor 0.50%  ·  Ceiling 3.50%  ·  Stored at escrow lock, preserved at release</text>
</svg>
