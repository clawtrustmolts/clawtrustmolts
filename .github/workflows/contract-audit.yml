name: Contract Audit (Heavy)

# Heavy fuzz / symbolic-execution / formal-proof job for ClawTrust smart
# contracts. This complements the lighter Slither + Hardhat checks in ci.yml
# and is REQUIRED to pass before any mainnet deploy.
#
# What this job runs (per CLAWTRUST_SECURITY_AUDIT_REPORT.md §6):
#   * Foundry — invariant fuzzing of the 7 audit invariants
#       (escrow conservation, TVL cap, reward-pool conservation, soulbound
#        transfers, FusedScore range, domain uniqueness, bond solvency).
#   * Echidna + Medusa — coverage-guided property fuzzing of the same 7
#       invariants via the test-fuzz/Echidna*.sol property contracts.
#   * Mythril — symbolic execution of each production contract
#       (--execution-timeout 600 --max-depth 12).
#   * Halmos — formal `prove_*` proofs for the four core contracts
#       (Escrow, SwarmValidator, ClawCardNFT, RepAdapter).
#   * Aderyn — Solidity static analysis, complementing Slither.
#
# Failure policy: any High or Medium severity finding fails the job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly heavy fuzz sweep at 03:00 UTC. Between merges to main, days can
    # pass without the full Echidna/Medusa pass running (PRs use the smoke
    # profile). The schedule event falls through to the heavy ECHIDNA_CONFIG /
    # MEDUSA_CONFIG branch below, keeping continuous deep-fuzz coverage
    # without slowing PRs. Failures surface in the Actions tab and don't
    # block PRs.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  foundry:
    name: Foundry invariants & fuzz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install npm deps (OpenZeppelin)
        run: npm install --no-audit --no-fund

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install forge-std
        run: |
          forge install --no-commit --no-git foundry-rs/forge-std || true
          forge install foundry-rs/forge-std --no-commit || true

      - name: Build
        run: forge build --sizes

      - name: Run unit fuzz tests
        run: forge test -vvv --fuzz-runs 100000

      - name: Run invariant tests
        run: forge test --match-test "invariant_" -vvv

  halmos:
    name: Halmos symbolic proofs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund

      - name: Install Foundry (Halmos depends on forge build)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: forge install foundry-rs/forge-std --no-commit || true
      - run: forge build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Halmos
        run: pip install halmos

      - name: Halmos — ClawTrustEscrow
        run: halmos --root . --contract HalmosProofs --function prove_escrow_tvl_cap --solver-timeout-assertion 60000
      - name: Halmos — ClawTrustSwarmValidator
        run: halmos --root . --contract HalmosProofs --function prove_swarm_reward_conservation --solver-timeout-assertion 60000
      - name: Halmos — ClawCardNFT
        run: halmos --root . --contract HalmosProofs --function prove_card_soulbound --solver-timeout-assertion 60000
      - name: Halmos — ClawTrustRepAdapter
        run: halmos --root . --contract HalmosProofs --function prove_repadapter_score_bounded --solver-timeout-assertion 60000

  mythril:
    name: Mythril symbolic execution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solc 0.8.24 + Mythril
        run: |
          pip install solc-select mythril
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Run Mythril on each production contract
        # --execution-timeout 600s, --max-depth 12 per audit recommendation.
        # JSON output is parsed with jq; ANY High or Medium finding fails the
        # job. A failed `myth` invocation OR malformed JSON also fails the job
        # (we never silently mask scanner failures).
        run: |
          set -euo pipefail
          mkdir -p mythril-out
          FAILED=0
          for f in contracts/ClawCardNFT.sol contracts/ClawTrustAC.sol \
                   contracts/ClawTrustBond.sol contracts/ClawTrustCrew.sol \
                   contracts/ClawTrustEscrow.sol contracts/ClawTrustRegistry.sol \
                   contracts/ClawTrustRepAdapter.sol contracts/ClawTrustSwarmValidator.sol \
                   contracts/ClawTrustTimelock.sol contracts/ERC8004IdentityRegistry.sol \
                   contracts/GuardianPausable.sol; do
            name=$(basename "$f" .sol)
            echo "::group::Mythril $name"
            set +e
            myth analyze "$f" \
              --solv 0.8.24 \
              --execution-timeout 600 \
              --max-depth 12 \
              --solc-json <(echo '{"remappings":["@openzeppelin/=node_modules/@openzeppelin/"]}') \
              -o jsonv2 > "mythril-out/${name}.json"
            RC=$?
            set -e
            # Mythril uses RC=1 when issues found, RC=0 when clean.
            # Anything else (>=2) is a tool/run failure that must NOT be masked.
            if [ "$RC" -ge 2 ]; then
              echo "::error file=$f::Mythril invocation failed for ${name} (rc=$RC)"
              FAILED=1
              echo "::endgroup::"
              continue
            fi
            if ! jq -e . "mythril-out/${name}.json" >/dev/null 2>&1; then
              echo "::error file=$f::Mythril produced invalid JSON for ${name}"
              FAILED=1
              echo "::endgroup::"
              continue
            fi
            HIGH_MED=$(jq '[.[].issues[]? | select(.severity=="High" or .severity=="Medium")] | length' "mythril-out/${name}.json")
            if [ "${HIGH_MED}" != "0" ]; then
              echo "::error file=$f::Mythril found ${HIGH_MED} High/Medium findings in ${name}"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED

      - name: Upload Mythril reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythril-reports
          path: contracts/mythril-out/

  aderyn:
    name: Aderyn static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund

      - name: Install Aderyn
        # Cyfrin/aderyn ships prebuilt binaries via cargo or curl install script.
        run: |
          curl -L https://raw.githubusercontent.com/Cyfrin/aderyn/dev/cyfrinup/install | bash
          echo "$HOME/.cyfrin/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cyfrin/bin:$PATH"
          cyfrinup
          aderyn --version

      - name: Run Aderyn (JSON + Markdown)
        run: |
          aderyn . --output aderyn-report.json
          aderyn . --output aderyn-report.md

      - name: Gate on High or Medium severity Aderyn findings
        # Use the structured JSON report so we count actual findings, never
        # section headers. Aderyn's JSON has a `high_issues` and
        # `medium_issues` object, each with an `issues: [...]` array. The
        # build fails if either array is non-empty.
        run: |
          set -euo pipefail
          HIGH=$(jq '(.high_issues.issues // []) | length' aderyn-report.json)
          MED=$(jq  '(.medium_issues.issues // []) | length' aderyn-report.json)
          echo "Aderyn findings — High: $HIGH, Medium: $MED"
          if [ "$HIGH" -gt 0 ] || [ "$MED" -gt 0 ]; then
            echo "::error::Aderyn reported $HIGH High and $MED Medium severity findings"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: |
            contracts/aderyn-report.md
            contracts/aderyn-report.json

  echidna:
    name: Echidna property fuzzing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      # Smoke profile (~2k iterations) on PRs for fast feedback; full 50k
      # sweep on pushes to main and manual dispatches.
      ECHIDNA_CONFIG: ${{ github.event_name == 'pull_request' && 'echidna.smoke.yaml' || 'echidna.yaml' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solc 0.8.24 + crytic-compile + slither
        run: |
          pip install solc-select crytic-compile slither-analyzer
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Install Echidna
        run: |
          curl -L https://github.com/crytic/echidna/releases/download/v2.2.5/echidna-2.2.5-x86_64-linux.tar.gz \
            -o echidna.tar.gz
          tar -xzf echidna.tar.gz
          chmod +x echidna
          sudo mv echidna /usr/local/bin/echidna
          echidna --version

      - name: Echidna — EchidnaEscrow (Invariants 1, 2)
        id: echidna_escrow
        run: |
          echidna test-fuzz/EchidnaEscrow.sol \
            --contract EchidnaEscrow \
            --config "$ECHIDNA_CONFIG" \
            --corpus-dir echidna-corpus/EchidnaEscrow

      - name: Collect EchidnaEscrow reproducers
        if: ${{ failure() && steps.echidna_escrow.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" echidna EchidnaEscrow echidna-corpus/EchidnaEscrow
      - name: Upload fuzz-failures-EchidnaEscrow
        if: ${{ failure() && steps.echidna_escrow.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaEscrow/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-EchidnaEscrow
          path: contracts/fuzz-failures/EchidnaEscrow/

      - name: Echidna — EchidnaBond (Invariant 7)
        id: echidna_bond
        run: |
          echidna test-fuzz/EchidnaBond.sol \
            --contract EchidnaBond \
            --config "$ECHIDNA_CONFIG" \
            --corpus-dir echidna-corpus/EchidnaBond

      - name: Collect EchidnaBond reproducers
        if: ${{ failure() && steps.echidna_bond.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" echidna EchidnaBond echidna-corpus/EchidnaBond
      - name: Upload fuzz-failures-EchidnaBond
        if: ${{ failure() && steps.echidna_bond.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaBond/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-EchidnaBond
          path: contracts/fuzz-failures/EchidnaBond/

      - name: Echidna — EchidnaSwarmValidator (Invariant 3)
        id: echidna_swarm
        run: |
          echidna test-fuzz/EchidnaSwarmValidator.sol \
            --contract EchidnaSwarmValidator \
            --config "$ECHIDNA_CONFIG" \
            --corpus-dir echidna-corpus/EchidnaSwarmValidator

      - name: Collect EchidnaSwarmValidator reproducers
        if: ${{ failure() && steps.echidna_swarm.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" echidna EchidnaSwarmValidator echidna-corpus/EchidnaSwarmValidator
      - name: Upload fuzz-failures-EchidnaSwarmValidator
        if: ${{ failure() && steps.echidna_swarm.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaSwarmValidator/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-EchidnaSwarmValidator
          path: contracts/fuzz-failures/EchidnaSwarmValidator/

      - name: Echidna — EchidnaSoulbound (Invariant 4)
        id: echidna_soulbound
        run: |
          echidna test-fuzz/EchidnaSoulbound.sol \
            --contract EchidnaSoulbound \
            --config "$ECHIDNA_CONFIG" \
            --corpus-dir echidna-corpus/EchidnaSoulbound

      - name: Collect EchidnaSoulbound reproducers
        if: ${{ failure() && steps.echidna_soulbound.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" echidna EchidnaSoulbound echidna-corpus/EchidnaSoulbound
      - name: Upload fuzz-failures-EchidnaSoulbound
        if: ${{ failure() && steps.echidna_soulbound.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaSoulbound/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-EchidnaSoulbound
          path: contracts/fuzz-failures/EchidnaSoulbound/

      - name: Echidna — EchidnaRepAdapter (Invariant 5)
        id: echidna_repadapter
        run: |
          echidna test-fuzz/EchidnaRepAdapter.sol \
            --contract EchidnaRepAdapter \
            --config "$ECHIDNA_CONFIG" \
            --corpus-dir echidna-corpus/EchidnaRepAdapter

      - name: Collect EchidnaRepAdapter reproducers
        if: ${{ failure() && steps.echidna_repadapter.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" echidna EchidnaRepAdapter echidna-corpus/EchidnaRepAdapter
      - name: Upload fuzz-failures-EchidnaRepAdapter
        if: ${{ failure() && steps.echidna_repadapter.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaRepAdapter/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-EchidnaRepAdapter
          path: contracts/fuzz-failures/EchidnaRepAdapter/

      - name: Echidna — EchidnaRegistry (Invariant 6)
        id: echidna_registry
        run: |
          echidna test-fuzz/EchidnaRegistry.sol \
            --contract EchidnaRegistry \
            --config "$ECHIDNA_CONFIG" \
            --corpus-dir echidna-corpus/EchidnaRegistry

      - name: Collect EchidnaRegistry reproducers
        if: ${{ failure() && steps.echidna_registry.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" echidna EchidnaRegistry echidna-corpus/EchidnaRegistry
      - name: Upload fuzz-failures-EchidnaRegistry
        if: ${{ failure() && steps.echidna_registry.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaRegistry/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-EchidnaRegistry
          path: contracts/fuzz-failures/EchidnaRegistry/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echidna-corpus
          path: echidna-corpus/

  medusa:
    name: Medusa property fuzzing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      # Smoke profile (~2k iterations) on PRs for fast feedback; full 50k
      # sweep on pushes to main and manual dispatches.
      MEDUSA_CONFIG: ${{ github.event_name == 'pull_request' && 'medusa.smoke.json' || 'medusa.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solc 0.8.24 + crytic-compile
        run: |
          pip install solc-select crytic-compile
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Install Medusa
        run: |
          curl -L https://github.com/crytic/medusa/releases/download/v0.1.8/medusa-linux-x64.tar.gz \
            -o medusa.tar.gz
          tar -xzf medusa.tar.gz
          chmod +x medusa
          sudo mv medusa /usr/local/bin/medusa
          medusa --version

      # Medusa is invoked once per property contract. We point --target at the
      # specific file so crytic-compile only walks that contract's deps, and we
      # override targetContracts/deploymentOrder via CLI so the same medusa.json
      # template is reused.
      - name: Medusa — EchidnaEscrow (Invariants 1, 2)
        id: medusa_escrow
        run: |
          jq '.fuzzing.targetContracts = ["EchidnaEscrow"] |
              .fuzzing.deploymentOrder = ["EchidnaEscrow"] |
              .fuzzing.corpusDirectory = "medusa-corpus/EchidnaEscrow" |
              .compilation.platformConfig.target = "test-fuzz/EchidnaEscrow.sol"' \
              "$MEDUSA_CONFIG" > medusa-escrow.json
          medusa fuzz --config medusa-escrow.json

      - name: Collect Medusa EchidnaEscrow reproducers
        if: ${{ failure() && steps.medusa_escrow.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" medusa EchidnaEscrow medusa-corpus/EchidnaEscrow
      - name: Upload fuzz-failures-medusa-EchidnaEscrow
        if: ${{ failure() && steps.medusa_escrow.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaEscrow/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-medusa-EchidnaEscrow
          path: contracts/fuzz-failures/EchidnaEscrow/

      - name: Medusa — EchidnaBond (Invariant 7)
        id: medusa_bond
        run: |
          jq '.fuzzing.targetContracts = ["EchidnaBond"] |
              .fuzzing.deploymentOrder = ["EchidnaBond"] |
              .fuzzing.corpusDirectory = "medusa-corpus/EchidnaBond" |
              .compilation.platformConfig.target = "test-fuzz/EchidnaBond.sol"' \
              "$MEDUSA_CONFIG" > medusa-bond.json
          medusa fuzz --config medusa-bond.json

      - name: Collect Medusa EchidnaBond reproducers
        if: ${{ failure() && steps.medusa_bond.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" medusa EchidnaBond medusa-corpus/EchidnaBond
      - name: Upload fuzz-failures-medusa-EchidnaBond
        if: ${{ failure() && steps.medusa_bond.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaBond/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-medusa-EchidnaBond
          path: contracts/fuzz-failures/EchidnaBond/

      - name: Medusa — EchidnaSwarmValidator (Invariant 3)
        id: medusa_swarm
        run: |
          jq '.fuzzing.targetContracts = ["EchidnaSwarmValidator"] |
              .fuzzing.deploymentOrder = ["EchidnaSwarmValidator"] |
              .fuzzing.corpusDirectory = "medusa-corpus/EchidnaSwarmValidator" |
              .compilation.platformConfig.target = "test-fuzz/EchidnaSwarmValidator.sol"' \
              "$MEDUSA_CONFIG" > medusa-swarm.json
          medusa fuzz --config medusa-swarm.json

      - name: Collect Medusa EchidnaSwarmValidator reproducers
        if: ${{ failure() && steps.medusa_swarm.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" medusa EchidnaSwarmValidator medusa-corpus/EchidnaSwarmValidator
      - name: Upload fuzz-failures-medusa-EchidnaSwarmValidator
        if: ${{ failure() && steps.medusa_swarm.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaSwarmValidator/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-medusa-EchidnaSwarmValidator
          path: contracts/fuzz-failures/EchidnaSwarmValidator/

      - name: Medusa — EchidnaSoulbound (Invariant 4)
        id: medusa_soulbound
        run: |
          jq '.fuzzing.targetContracts = ["EchidnaSoulbound"] |
              .fuzzing.deploymentOrder = ["EchidnaSoulbound"] |
              .fuzzing.corpusDirectory = "medusa-corpus/EchidnaSoulbound" |
              .compilation.platformConfig.target = "test-fuzz/EchidnaSoulbound.sol"' \
              "$MEDUSA_CONFIG" > medusa-soulbound.json
          medusa fuzz --config medusa-soulbound.json

      - name: Collect Medusa EchidnaSoulbound reproducers
        if: ${{ failure() && steps.medusa_soulbound.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" medusa EchidnaSoulbound medusa-corpus/EchidnaSoulbound
      - name: Upload fuzz-failures-medusa-EchidnaSoulbound
        if: ${{ failure() && steps.medusa_soulbound.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaSoulbound/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-medusa-EchidnaSoulbound
          path: contracts/fuzz-failures/EchidnaSoulbound/

      - name: Medusa — EchidnaRepAdapter (Invariant 5)
        id: medusa_repadapter
        run: |
          jq '.fuzzing.targetContracts = ["EchidnaRepAdapter"] |
              .fuzzing.deploymentOrder = ["EchidnaRepAdapter"] |
              .fuzzing.corpusDirectory = "medusa-corpus/EchidnaRepAdapter" |
              .compilation.platformConfig.target = "test-fuzz/EchidnaRepAdapter.sol"' \
              "$MEDUSA_CONFIG" > medusa-repadapter.json
          medusa fuzz --config medusa-repadapter.json

      - name: Collect Medusa EchidnaRepAdapter reproducers
        if: ${{ failure() && steps.medusa_repadapter.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" medusa EchidnaRepAdapter medusa-corpus/EchidnaRepAdapter
      - name: Upload fuzz-failures-medusa-EchidnaRepAdapter
        if: ${{ failure() && steps.medusa_repadapter.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaRepAdapter/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-medusa-EchidnaRepAdapter
          path: contracts/fuzz-failures/EchidnaRepAdapter/

      - name: Medusa — EchidnaRegistry (Invariant 6)
        id: medusa_registry
        run: |
          jq '.fuzzing.targetContracts = ["EchidnaRegistry"] |
              .fuzzing.deploymentOrder = ["EchidnaRegistry"] |
              .fuzzing.corpusDirectory = "medusa-corpus/EchidnaRegistry" |
              .compilation.platformConfig.target = "test-fuzz/EchidnaRegistry.sol"' \
              "$MEDUSA_CONFIG" > medusa-registry.json
          medusa fuzz --config medusa-registry.json

      - name: Collect Medusa EchidnaRegistry reproducers
        if: ${{ failure() && steps.medusa_registry.outcome == 'failure' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/collect-fuzz-failures.sh" medusa EchidnaRegistry medusa-corpus/EchidnaRegistry
      - name: Upload fuzz-failures-medusa-EchidnaRegistry
        if: ${{ failure() && steps.medusa_registry.outcome == 'failure' && hashFiles('contracts/fuzz-failures/EchidnaRegistry/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-medusa-EchidnaRegistry
          path: contracts/fuzz-failures/EchidnaRegistry/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medusa-corpus
          path: contracts/medusa-corpus/
