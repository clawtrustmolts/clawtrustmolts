name: Release Notes

# Task #107: cut a GitHub Release automatically every time a `v*` tag is
# pushed.
#
# What this workflow does:
#   1. Computes the changelog as `git log <prev-tag>..<this-tag>` (or the
#      full history if this is the very first tag).
#   2. Looks up the most recent SUCCESSFUL `Deploy Contracts (Mainnet)` run
#      for this exact tag and, if one exists, downloads the
#      `deployed-addresses-<tag>` artifact uploaded by that run.
#   3. Task #110: also tries to download the previous tag's addresses
#      artifact and, if both are present, inlines a per-contract diff
#      (re-deployed / added / removed / unchanged) into the release body
#      so readers don't have to download and diff the JSON by hand.
#   4. Creates a GitHub Release for the tag with the changelog as the body
#      and `deployed-addresses.json` attached as a release asset (only
#      when the deploy artifact was found — we never invent or stale-fill
#      that file).
#
# Why this exists: mainnet deploys are pinned to v* tags (Task #105) and
# `contracts/deployed-addresses.json` records the tag/ref/commit. This
# workflow surfaces all of that on a single human-readable Release page so
# nobody has to write release notes by hand.

on:
  push:
    tags:
      - 'v*'

# `contents: write` is required to create the Release. `actions: read` lets
# us query the deploy workflow's runs and download its artifact.
permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Cut GitHub Release for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # Hoist the chat webhook secrets to job scope so the notify step's
    # `if:` can read them via `env.` unambiguously (step-level env is
    # evaluated together with the step, which can make `if` checks
    # against it surprising). Treat empty string as "not configured".
    #
    # Task #118: per-event routing. Releases go to RELEASE_CHAT_WEBHOOK_URL.
    # Failure pings prefer FAILURE_CHAT_WEBHOOK_URL but fall back to
    # RELEASE_CHAT_WEBHOOK_URL so single-channel teams keep working with
    # no config changes. Verbosity (`full` Block Kit vs. one-line `compact`)
    # is configurable via repo/org variables; see docs/notifications.md.
    env:
      RELEASE_CHAT_WEBHOOK_URL: ${{ secrets.RELEASE_CHAT_WEBHOOK_URL }}
      FAILURE_CHAT_WEBHOOK_URL: ${{ secrets.FAILURE_CHAT_WEBHOOK_URL }}
      RELEASE_CHAT_VERBOSITY: ${{ vars.RELEASE_CHAT_VERBOSITY }}
      FAILURE_CHAT_VERBOSITY: ${{ vars.FAILURE_CHAT_VERBOSITY }}
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          # Need full history + tags to diff against the previous tag.
          fetch-depth: 0

      - name: Compute previous tag and changelog
        id: changelog
        env:
          THIS_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Make sure tags are present even if checkout shallow-fetched them.
          git fetch --tags --force --quiet

          # Find the most recent v* tag that is NOT this one. We sort by
          # creatordate so the comparison is chronological rather than
          # lexicographic (v1.10.0 must come after v1.9.0).
          PREV_TAG=$(git tag --list 'v*' --sort=-creatordate \
            | grep -vxF "$THIS_TAG" | head -n 1 || true)

          {
            echo "## What's changed"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since \`$PREV_TAG\`:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' \
                "${PREV_TAG}..${THIS_TAG}"
              echo
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${THIS_TAG}"
            else
              echo "Initial release. All commits up to \`$THIS_TAG\`:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "$THIS_TAG"
            fi
          } > CHANGELOG.md

          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "----- CHANGELOG.md -----"
          cat CHANGELOG.md

      # Find the most recent SUCCESSFUL `Deploy Contracts (Mainnet)` run
      # whose head_sha matches this tag's commit. If none exists yet (e.g.
      # the tag was just pushed and a deploy hasn't been dispatched), we
      # skip the artifact attachment instead of failing — the Release is
      # still useful as a changelog.
      # We want THE deploy run for THIS tag, not just any run that happens
      # to share the tag's commit SHA (multiple tags can point at the same
      # commit). The workflow_runs API exposes `head_branch`, which for a
      # tag-triggered dispatch is the tag name itself — so we filter on
      # both head_sha and head_branch == tag. We also iterate matching
      # runs newest-first and pick the first one that actually has the
      # expected artifact, so an old run that has since lost its artifact
      # to retention won't shadow a more recent successful re-deploy.
      - name: Find matching deploy run
        id: deploy_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="deployed-addresses-${TAG}"
          echo "Looking up 'Deploy Contracts (Mainnet)' runs for sha=$SHA tag=$TAG"
          RUNS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/workflows/deploy-mainnet.yml/runs?head_sha=${SHA}&per_page=50")

          # Successful, completed runs whose head_branch is exactly this tag,
          # newest first.
          CANDIDATES=$(echo "$RUNS" | jq -r --arg tag "$TAG" '
            [.workflow_runs[]
              | select(.status=="completed"
                       and .conclusion=="success"
                       and .head_branch==$tag)]
            | sort_by(.created_at) | reverse | .[].id
          ')

          RUN_ID=""
          for id in $CANDIDATES; do
            HAS=$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/runs/${id}/artifacts?per_page=100" \
              | jq -r --arg n "$ARTIFACT_NAME" \
                '[.artifacts[] | select(.name==$n and .expired==false)] | length')
            if [ "$HAS" -gt 0 ]; then
              RUN_ID="$id"
              echo "Picked deploy run id=$RUN_ID (has artifact $ARTIFACT_NAME)"
              break
            fi
            echo "Run id=$id has no live artifact $ARTIFACT_NAME, skipping"
          done

          if [ -z "$RUN_ID" ]; then
            echo "No successful deploy run with artifact $ARTIFACT_NAME found — release will be created without addresses asset."
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download deployed-addresses artifact
        id: download
        if: ${{ steps.deploy_run.outputs.run_id != '' }}
        # `continue-on-error` so a missing/expired artifact doesn't block
        # the release. We still attempt the download because in the happy
        # path it should exist.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deployed-addresses-${{ github.ref_name }}
          path: release-assets
          run-id: ${{ steps.deploy_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify addresses asset (if any)
        id: asset
        run: |
          set -euo pipefail
          if [ -f release-assets/deployed-addresses.json ]; then
            echo "Found deployed-addresses.json — will attach to release."
            echo "files=release-assets/deployed-addresses.json" >> "$GITHUB_OUTPUT"
          else
            echo "No deployed-addresses.json available; releasing without asset."
            echo "files=" >> "$GITHUB_OUTPUT"
          fi

      # Task #110: also try to fetch the *previous* tag's addresses
      # artifact so we can compute a per-contract diff and inline it in
      # the release body. Same lookup strategy as the current-tag run:
      # match the deploy workflow's run by head_sha + head_branch and
      # pick the newest one that still has a live artifact. If anything
      # is missing (no previous tag, no matching deploy run, expired
      # artifact) we skip the diff section gracefully.
      - name: Find previous tag's deploy run
        id: prev_deploy
        if: ${{ steps.changelog.outputs.prev_tag != '' && steps.asset.outputs.files != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PREV_TAG: ${{ steps.changelog.outputs.prev_tag }}
        run: |
          set -euo pipefail
          PREV_SHA=$(git rev-list -n 1 "$PREV_TAG" 2>/dev/null || true)
          if [ -z "$PREV_SHA" ]; then
            echo "Could not resolve commit for $PREV_TAG; skipping diff."
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "artifact_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARTIFACT_NAME="deployed-addresses-${PREV_TAG}"
          RUNS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/workflows/deploy-mainnet.yml/runs?head_sha=${PREV_SHA}&per_page=50")
          CANDIDATES=$(echo "$RUNS" | jq -r --arg tag "$PREV_TAG" '
            [.workflow_runs[]
              | select(.status=="completed"
                       and .conclusion=="success"
                       and .head_branch==$tag)]
            | sort_by(.created_at) | reverse | .[].id
          ')
          RUN_ID=""
          for id in $CANDIDATES; do
            HAS=$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/runs/${id}/artifacts?per_page=100" \
              | jq -r --arg n "$ARTIFACT_NAME" \
                '[.artifacts[] | select(.name==$n and .expired==false)] | length')
            if [ "$HAS" -gt 0 ]; then
              RUN_ID="$id"
              echo "Picked previous deploy run id=$RUN_ID for $PREV_TAG"
              break
            fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "No live $ARTIFACT_NAME artifact for $PREV_TAG; diff section will be skipped."
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download previous deployed-addresses artifact
        if: ${{ steps.prev_deploy.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev_deploy.outputs.artifact_name }}
          path: prev-release-assets
          run-id: ${{ steps.prev_deploy.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Compute the per-contract diff and append a "Deployed contracts"
      # section to CHANGELOG.md. Skipped entirely if either side of the
      # comparison is missing (no current artifact, no previous artifact,
      # or no previous tag at all).
      - name: Append contracts diff to release notes
        if: ${{ steps.asset.outputs.files != '' }}
        env:
          PREV_TAG: ${{ steps.changelog.outputs.prev_tag }}
        run: |
          set -euo pipefail
          CURR=release-assets/deployed-addresses.json
          PREV=prev-release-assets/deployed-addresses.json
          if [ ! -f "$CURR" ]; then
            echo "No current addresses file; nothing to diff."
            exit 0
          fi
          if [ -z "${PREV_TAG}" ] || [ ! -f "$PREV" ]; then
            echo "No previous addresses available; skipping Deployed contracts section."
            exit 0
          fi

          # Bind each entry to $e before checking $p — inside `($p|...)`
          # the implicit `.` rebinds to $p, so we can't use `.key` there.
          jq -n \
            --slurpfile curr "$CURR" \
            --slurpfile prev "$PREV" '
              ($curr[0].contracts // {}) as $c |
              ($prev[0].contracts // {}) as $p |
              {
                added:     [$c | to_entries[] | . as $e
                             | select($p | has($e.key) | not)
                             | {name: $e.key, addr: $e.value}],
                removed:   [$p | to_entries[] | . as $e
                             | select($c | has($e.key) | not)
                             | {name: $e.key, addr: $e.value}],
                changed:   [$c | to_entries[] | . as $e
                             | select(($p | has($e.key))
                                      and ($p[$e.key]|ascii_downcase)
                                          != ($e.value|ascii_downcase))
                             | {name: $e.key, new: $e.value, old: $p[$e.key]}],
                unchanged: [$c | to_entries[] | . as $e
                             | select(($p | has($e.key))
                                      and ($p[$e.key]|ascii_downcase)
                                          == ($e.value|ascii_downcase))
                             | {name: $e.key, addr: $e.value}]
              }
            ' > contracts-diff.json

          n_changed=$(jq '.changed   | length' contracts-diff.json)
          n_added=$(jq   '.added     | length' contracts-diff.json)
          n_removed=$(jq '.removed   | length' contracts-diff.json)
          n_unchanged=$(jq '.unchanged | length' contracts-diff.json)

          {
            echo
            echo "## Deployed contracts"
            echo
            echo "Comparison vs \`$PREV_TAG\`:"
            echo
            if [ "$n_changed" -gt 0 ]; then
              echo "### Re-deployed (address changed)"
              jq -r '.changed[] | "- **\(.name)**: `\(.new)` (was `\(.old)`)"' contracts-diff.json
              echo
            fi
            if [ "$n_added" -gt 0 ]; then
              echo "### Added"
              jq -r '.added[] | "- **\(.name)**: `\(.addr)`"' contracts-diff.json
              echo
            fi
            if [ "$n_removed" -gt 0 ]; then
              echo "### Removed"
              jq -r '.removed[] | "- **\(.name)**: was `\(.addr)`"' contracts-diff.json
              echo
            fi
            if [ "$n_unchanged" -gt 0 ]; then
              echo "### Unchanged"
              jq -r '.unchanged[] | "- **\(.name)**: `\(.addr)`"' contracts-diff.json
              echo
            fi
            if [ "$n_changed" -eq 0 ] && [ "$n_added" -eq 0 ] && [ "$n_removed" -eq 0 ]; then
              echo "_No contract address changes since \`$PREV_TAG\`._"
              echo
            fi
          } >> CHANGELOG.md

          echo "----- Updated CHANGELOG.md -----"
          cat CHANGELOG.md

      # Use the official GitHub CLI (`gh release create`) which is
      # preinstalled on GitHub-hosted runners and is the supported way to
      # create releases from Actions. Tags containing `-` (e.g. v1.2.3-rc1)
      # are marked as prereleases.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.asset.outputs.files }}
        run: |
          set -euo pipefail
          ARGS=(release create "$TAG" --title "$TAG" --notes-file CHANGELOG.md)
          case "$TAG" in
            *-*) ARGS+=(--prerelease) ;;
          esac
          if [ -n "$ASSET" ] && [ -f "$ASSET" ]; then
            ARGS+=("$ASSET")
          fi
          gh "${ARGS[@]}"

      # Task #111: post a heads-up to the team chat when a release is cut.
      # Task #114: enrich the message with release author, prerelease
      # flag, and whether the deployed-addresses.json asset was attached.
      # Slack incoming webhooks render the `blocks` field with Block Kit
      # for nicer formatting; Discord ignores `blocks` and falls back to
      # `content`. We send both fields in the same payload so we don't
      # have to know which provider is configured. `text` is also kept
      # as a Slack fallback (used for notifications/previews where Block
      # Kit isn't rendered).
      #
      # The webhook URL lives in the `RELEASE_CHAT_WEBHOOK_URL` repo secret
      # (hoisted to job-level env above). If the secret is unset we skip
      # silently — a missing webhook should never fail the release. We
      # also use `continue-on-error` so a chat outage / misbehaving
      # webhook can't undo a release that has already been published in
      # the previous step.
      - name: Notify team chat
        if: ${{ env.RELEASE_CHAT_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ASSET: ${{ steps.asset.outputs.files }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          AUTHOR_URL="https://github.com/${ACTOR}"

          # Tags containing `-` (e.g. v1.2.3-rc1) are treated as
          # prereleases by the "Create GitHub Release" step above; mirror
          # that classification here so chat reflects the actual release
          # type without us re-querying the API.
          case "$TAG" in
            *-*) PRERELEASE="true"; RELEASE_KIND="Prerelease"; EMOJI=":test_tube:" ;;
            *)   PRERELEASE="false"; RELEASE_KIND="Release";    EMOJI=":package:" ;;
          esac

          # Whether the deployed-addresses.json asset made it onto the
          # release, plus the total asset count attached to this release.
          # `steps.asset.outputs.files` is empty when no matching deploy
          # run / live artifact was found. We also query the GitHub API
          # for the published release so the count reflects what users
          # will actually see on the release page (today this is 0 or 1,
          # but the field future-proofs the message if more assets get
          # attached later).
          if [ -n "${ASSET:-}" ] && [ -f "${ASSET}" ]; then
            HAS_ADDRESSES="yes"
            ADDRESSES_EMOJI=":white_check_mark:"
          else
            HAS_ADDRESSES="no (deploy not found for this tag)"
            ADDRESSES_EMOJI=":warning:"
          fi

          # Best-effort asset count via the GitHub API. Failures (e.g.
          # eventual-consistency on a freshly-created release) fall back
          # to "unknown" rather than blocking the notification.
          ASSET_COUNT=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/releases/tags/${TAG}" \
            --jq '.assets | length' 2>/dev/null || echo "unknown")
          ADDRESSES_NOTE="deployed-addresses.json: ${HAS_ADDRESSES} (assets attached: ${ASSET_COUNT})"

          # Trim the changelog to a short snippet so chat messages stay
          # readable. We keep the first ~20 changelog lines and append an
          # ellipsis if we truncated.
          SNIPPET_LINES=20
          if [ "$(wc -l < CHANGELOG.md)" -gt "$SNIPPET_LINES" ]; then
            SNIPPET="$(head -n "$SNIPPET_LINES" CHANGELOG.md)
…(truncated, see full notes at $RELEASE_URL)"
          else
            SNIPPET="$(cat CHANGELOG.md)"
          fi

          # Plain-text message — used as the Discord `content` and as
          # the Slack `text` fallback for notifications/previews.
          MESSAGE="${EMOJI} New ${RELEASE_KIND} **${TAG}** is out: ${RELEASE_URL}
Author: @${ACTOR} (${AUTHOR_URL})
Prerelease: ${PRERELEASE}
${ADDRESSES_EMOJI} ${ADDRESSES_NOTE}

${SNIPPET}"

          # Discord rejects messages over 2000 characters with HTTP 400,
          # and Slack has its own (much higher) limit. Cap the message at
          # ~1900 chars so both providers accept it; if we cut it down,
          # leave a pointer back to the release URL.
          MAX_LEN=1900
          if [ "${#MESSAGE}" -gt "$MAX_LEN" ]; then
            KEEP=$(( MAX_LEN - 80 ))
            MESSAGE="${MESSAGE:0:$KEEP}
…(truncated, see full notes at $RELEASE_URL)"
          fi

          # Slack Block Kit body. The snippet is emitted in a `mrkdwn`
          # section block (Slack's flavored markdown) and metadata sits
          # in a `context` block beneath the header for at-a-glance
          # scanning. Slack also caps section text at 3000 chars, so
          # cap the snippet defensively.
          SLACK_SNIPPET="$SNIPPET"
          if [ "${#SLACK_SNIPPET}" -gt 2800 ]; then
            SLACK_SNIPPET="${SLACK_SNIPPET:0:2700}
…(truncated, see full notes at $RELEASE_URL)"
          fi

          # Task #118: verbosity routing. `compact` collapses to a single
          # line (no Block Kit, no changelog snippet) for low-noise
          # channels; the default `full` keeps the existing rich payload.
          # Anything other than `compact` (including unset / `full`) keeps
          # the rich payload so misconfiguration biases toward more info,
          # not less.
          VERBOSITY="${RELEASE_CHAT_VERBOSITY:-full}"
          if [ "$VERBOSITY" = "compact" ]; then
            ONE_LINER="${EMOJI} ${RELEASE_KIND} ${TAG} by @${ACTOR} — ${RELEASE_URL}"
            PAYLOAD=$(jq -n --arg msg "$ONE_LINER" \
              '{text: $msg, content: $msg}')
          else
            PAYLOAD=$(jq -n \
              --arg msg          "$MESSAGE" \
              --arg tag          "$TAG" \
              --arg release_url  "$RELEASE_URL" \
              --arg actor        "$ACTOR" \
              --arg author_url   "$AUTHOR_URL" \
              --arg release_kind "$RELEASE_KIND" \
              --arg prerelease   "$PRERELEASE" \
              --arg addresses    "$ADDRESSES_NOTE" \
              --arg snippet      "$SLACK_SNIPPET" \
              --arg emoji        "$EMOJI" \
              '{
                text: $msg,
                content: $msg,
                blocks: [
                  { type: "header",
                    text: { type: "plain_text",
                            text: ($emoji + " New " + $release_kind + " " + $tag),
                            emoji: true } },
                  { type: "section",
                    text: { type: "mrkdwn",
                            text: ("<" + $release_url + "|View release " + $tag + ">") } },
                  { type: "context",
                    elements: [
                      { type: "mrkdwn",
                        text: ("*Author:* <" + $author_url + "|@" + $actor + ">") },
                      { type: "mrkdwn",
                        text: ("*Prerelease:* " + $prerelease) },
                      { type: "mrkdwn",
                        text: ("*Addresses:* " + $addresses) }
                    ] },
                  { type: "divider" },
                  { type: "section",
                    text: { type: "mrkdwn", text: $snippet } }
                ]
              }')
          fi

          HTTP_CODE=$(curl -sS -o /tmp/webhook_resp -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST --data "$PAYLOAD" "$RELEASE_CHAT_WEBHOOK_URL")
          echo "Webhook responded with HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "Webhook body:"
            cat /tmp/webhook_resp || true
            # `continue-on-error: true` above means this exit won't fail
            # the job — but we still surface the error in the step log.
            exit 1
          fi

      # Task #115: if any earlier step in this job failed, post a
      # failure ping to the same chat channel so nobody has to discover
      # a broken release by digging through the Actions tab.
      #
      # `failure()` is true when a previous step in the job failed (and
      # is false on success/cancellation), which is exactly the
      # "release.yml itself blew up" case we want to flag. We still gate
      # on the webhook secret being configured — a missing secret should
      # skip (not fail) the ping, matching the success-notify behavior
      # above. `continue-on-error` keeps a chat outage from masking the
      # real failure that triggered this step.
      #
      # Task #118: route failure pings to FAILURE_CHAT_WEBHOOK_URL when
      # set, otherwise fall back to RELEASE_CHAT_WEBHOOK_URL so existing
      # single-channel setups keep getting alerts. Verbosity defaults to
      # `full` (Block Kit with run link); set FAILURE_CHAT_VERBOSITY=compact
      # for a single-line ping in busy channels.
      - name: Notify team chat on failure
        if: ${{ failure() && (env.FAILURE_CHAT_WEBHOOK_URL != '' || env.RELEASE_CHAT_WEBHOOK_URL != '') }}
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          TARGET_URL="${FAILURE_CHAT_WEBHOOK_URL:-$RELEASE_CHAT_WEBHOOK_URL}"
          VERBOSITY="${FAILURE_CHAT_VERBOSITY:-full}"

          if [ "$VERBOSITY" = "compact" ]; then
            MESSAGE=":rotating_light: Release ${TAG} failed — ${RUN_URL}"
            PAYLOAD=$(jq -n --arg msg "$MESSAGE" \
              '{text: $msg, content: $msg}')
          else
            MESSAGE=":rotating_light: Release workflow **failed** for tag \`${TAG}\`.
Failed run: ${RUN_URL}"
            PAYLOAD=$(jq -n \
              --arg msg     "$MESSAGE" \
              --arg tag     "$TAG" \
              --arg run_url "$RUN_URL" \
              '{
                text: $msg,
                content: $msg,
                blocks: [
                  { type: "header",
                    text: { type: "plain_text",
                            text: (":rotating_light: Release " + $tag + " failed"),
                            emoji: true } },
                  { type: "section",
                    text: { type: "mrkdwn",
                            text: ("<" + $run_url + "|View failed run>") } }
                ]
              }')
          fi

          HTTP_CODE=$(curl -sS -o /tmp/webhook_resp -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST --data "$PAYLOAD" "$TARGET_URL")
          echo "Failure webhook responded with HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "Webhook body:"
            cat /tmp/webhook_resp || true
            exit 1
          fi
