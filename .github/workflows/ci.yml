name: ClawTrust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      # ESLint now uses flat config (eslint.config.js) — no --ext needed.
      # Security rules are `warn`; only `error`-level rules fail the build.
      # The || true is intentionally removed so lint errors actually block merges.
      - run: npx eslint .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clawtrust
          POSTGRES_PASSWORD: clawtrust_test
          POSTGRES_DB: clawtrust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://clawtrust:clawtrust_test@localhost:5432/clawtrust_test
      SESSION_SECRET: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:push
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx hardhat compile

  # ── Secret scanning ────────────────────────────────────────────────────────
  # Gitleaks scans the full git history for committed secrets: private keys,
  # API tokens, credentials. Fails the build if any are found.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Static Application Security Testing ───────────────────────────────────
  # Semgrep scans TypeScript / Express code for security antipatterns using
  # community rulesets: typescript, express, jwt, owasp-top-ten.
  # Only ERROR-severity findings fail the build (WARNING findings are reported
  # but do not block merges on day one).
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/express
            p/jwt
            p/owasp-top-ten
        env:
          # Only fail on ERROR-severity findings.
          # Most community-ruleset findings are WARNING level, so this keeps
          # the build green on day one while blocking high-confidence issues.
          SEMGREP_OPTIONS: "--severity ERROR"

  # ── Dependency vulnerability audit ────────────────────────────────────────
  # Uses audit-ci so we can maintain a precise allowlist of known acceptable
  # advisories instead of lowering the global severity threshold.
  # GHSA-52f5-9888-hmc6 (tmp ≤0.2.3 via hardhat/solc) is explicitly allowlisted:
  # it is a build-time dev tool with no runtime exposure; the fix requires a
  # breaking upgrade to hardhat@3.3.0 — scheduled for a separate task.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx audit-ci --high --allowlist GHSA-52f5-9888-hmc6
