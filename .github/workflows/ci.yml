name: ClawTrust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      # ESLint uses .eslintrc.json (legacy config, ESLint 8) with @typescript-eslint
      # and eslint-plugin-security. Dangerous patterns are `error`; existing code
      # issues tuned to `warn` so the build passes on day one.
      # || true removed — lint errors now actually block merges.
      - run: npx eslint . --ext .ts,.tsx

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clawtrust
          POSTGRES_PASSWORD: clawtrust_test
          POSTGRES_DB: clawtrust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://clawtrust:clawtrust_test@localhost:5432/clawtrust_test
      SESSION_SECRET: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:push
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx hardhat compile

  # ── Secret scanning ────────────────────────────────────────────────────────
  # Gitleaks scans the full git history on every push and PR for committed
  # secrets: private keys, API tokens, credentials.
  # .gitleaks.toml allowlists the Ethereum zero-address placeholder and doc paths.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Static Application Security Testing ───────────────────────────────────
  # Semgrep scans TypeScript/Express code using four community rulesets.
  # .semgrepignore excludes node_modules, dist, contracts, and test fixtures.
  # Only ERROR-level findings fail the build; warnings are informational.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/express
            p/jwt
            p/owasp-top-ten
        env:
          SEMGREP_OPTIONS: "--severity ERROR"

  # ── Dependency vulnerability audit ────────────────────────────────────────
  # Runs npm audit --audit-level=high. Fails if any HIGH or CRITICAL CVE is
  # found in the dependency tree.
  # NOTE: hardhat is currently in `dependencies` instead of `devDependencies`.
  # It is a build-time contract compiler with no runtime exposure, but npm
  # treats it as a production dependency. Moving it to devDependencies with
  # `npm install --save-dev hardhat` will allow this job to pass cleanly.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
